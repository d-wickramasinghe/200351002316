<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Government Training Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Training Nomination</h1>

        <p class="subtitle">
            Government Training Management System
        </p>

        <form id="nominationForm">

            <!-- Officer ID -->

            <div class="form-group">

                <label for="officerId">
                    Officer ID
                </label>

                <input
                    type="text"
                    id="officerId"
                    placeholder="e.g. OFF001"
                    required
                >

                <small>
                    Enter the unique officer ID
                </small>

            </div>


            <!-- Officer Name -->

            <div class="form-group">

                <label for="officerName">
                    Officer Name
                </label>

                <input
                    type="text"
                    id="officerName"
                    placeholder="Enter officer name"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="officer@example.com"
                    required
                >

            </div>


            <!-- Training -->

            <div class="form-group">

                <label for="trainingTitle">
                    Training Programme
                </label>

                <input
                    type="text"
                    id="trainingTitle"
                    placeholder="Enter training title"
                    required
                >

            </div>


            <!-- Department -->

            <div class="form-group">

                <label for="departmentName">
                    Department
                </label>

                <input
                    type="text"
                    id="departmentName"
                    placeholder="Enter department name"
                    required
                >

            </div>


            <!-- Submit -->

            <button type="submit">
                Submit Nomination
            </button>

        </form>


        <div id="message"></div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
